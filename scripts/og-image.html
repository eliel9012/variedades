<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700&family=Plus+Jakarta+Sans:wght@500;600&display=swap');

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0d3b2e;
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        background: linear-gradient(160deg, #0d3b2e 0%, #0a2d23 100%);
        display: flex;
        align-items: center;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      .text-col {
        flex: 0 0 auto;
        padding: 0 0 0 88px;
        width: 620px;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }

      .mark-badge {
        width: 56px;
        height: 56px;
        border-radius: 999px;
        border: 3px solid #a3d0be;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Newsreader', serif;
        font-weight: 700;
        font-size: 24px;
        color: #f8f6f0;
      }

      .mark-label {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a3d0be;
      }

      h1 {
        font-family: 'Newsreader', serif;
        font-weight: 700;
        font-size: 112px;
        line-height: 1;
        color: #fbf9f3;
        letter-spacing: -0.01em;
      }

      .subtitle {
        margin-top: 26px;
        font-family: 'Newsreader', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 34px;
        color: #d7ebe1;
      }

      /* Versão por lugar (?place=...): o nome da cidade/UF vira o destaque. */
      .lead {
        display: none;
        font-family: 'Newsreader', serif;
        font-style: italic;
        font-weight: 600;
        font-size: 34px;
        color: #d7ebe1;
        margin-bottom: 10px;
      }
      .is-place .lead { display: block; }
      .is-place h1 { font-size: 96px; line-height: 1.02; letter-spacing: -0.015em; }
      .is-place .subtitle { font-size: 28px; margin-top: 22px; }
      .is-place .partners { margin-top: 30px; }

      .footer-line {
        margin-top: 22px;
        font-size: 20px;
        font-weight: 500;
        color: #8fb8a6;
      }

      .footer-line .sep { margin: 0 12px; opacity: 0.6; }

      /* Logos parceiras em branco sobre o verde; a bandeira do IK fica colorida. */
      .partners {
        margin-top: 40px;
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .partners .phvox {
        height: 40px;
        width: auto;
        filter: brightness(0) invert(1);
        opacity: 0.94;
      }

      .partners .divider {
        width: 2px;
        height: 44px;
        background: rgba(163, 208, 190, 0.45);
      }

      .partners .ik {
        height: 50px;
        width: auto;
      }

      /* Grafico decorativo (sem numero/rotulo: e so um motivo visual nas
         cores da bandeira, nunca um dado real ou simulado de eleicao). */
      .chart-col {
        flex: 1;
        height: 100%;
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 22px;
        padding: 0 70px 90px 20px;
      }

      .chart-col::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 620px 620px at 70% 35%, rgba(163, 208, 190, 0.14), transparent 65%);
      }

      /* Selo do ano na versão 2022: deixa claro na prévia que não é a apuração ao vivo. */
      .year-stamp {
        display: none;
        position: absolute;
        top: 70px;
        right: 70px;
        z-index: 2;
        padding: 10px 26px;
        border-radius: 999px;
        background: #f5c518;
        color: #0d3b2e;
        font-family: 'Newsreader', serif;
        font-weight: 700;
        font-size: 64px;
        line-height: 1;
      }
      .is-2022 .year-stamp { display: block; }

      .bar {
        position: relative;
        width: 56px;
        border-radius: 10px 10px 0 0;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
      }

      .bar.green { height: 230px; background: linear-gradient(180deg, #2fae66, #16824a); }
      .bar.yellow { height: 340px; background: linear-gradient(180deg, #ffd54a, #f2b705); }
      .bar.blue { height: 190px; background: linear-gradient(180deg, #3f7fd1, #2a5ea8); }
      .bar.white { height: 270px; background: linear-gradient(180deg, #ffffff, #e4e2dd); }
      .bar.green2 { height: 120px; background: linear-gradient(180deg, #2fae66, #16824a); }

      .trend-line {
        position: absolute;
        left: 20px;
        right: 70px;
        bottom: 90px;
        height: 240px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="text-col">
        <div class="mark">
          <div class="mark-badge">AB</div>
          <div class="mark-label">Eleições Gerais 2026</div>
        </div>
        <p class="lead" id="lead"></p>
        <h1 id="title">Apura Brasil</h1>
        <p class="subtitle" id="subtitle">Apuração ao vivo, direto do TSE</p>
        <div class="partners">
          <img class="phvox" src="../public/phvox-logo.png" alt="PHVox" />
          <span class="divider"></span>
          <svg class="ik" viewBox="13 18 267 247" xmlns="http://www.w3.org/2000/svg" aria-label="IK">
            <defs><clipPath id="flagClip"><rect x="15" y="20" width="45" height="30"/></clipPath></defs>
            <g clip-path="url(#flagClip)">
              <rect x="15" y="20" width="45" height="30" fill="#012169"/>
              <path d="M15 20 L20.2 20 L60 46.5 L60 50 L54.8 50 L15 23.5 Z" fill="#FFFFFF"/>
              <path d="M60 20 L54.8 20 L15 46.5 L15 50 L20.2 50 L60 23.5 Z" fill="#FFFFFF"/>
              <path d="M15 20 L17.9 20 L60 48.0 L60 50 L57.1 50 L15 22.0 Z" fill="#C8102E"/>
              <path d="M60 20 L57.1 20 L15 48.0 L15 50 L17.9 50 L60 22.0 Z" fill="#C8102E"/>
              <rect x="32" y="20" width="11" height="30" fill="#FFFFFF"/>
              <rect x="15" y="29.5" width="45" height="11" fill="#FFFFFF"/>
              <rect x="35" y="20" width="5" height="30" fill="#C8102E"/>
              <rect x="15" y="32.5" width="45" height="5" fill="#C8102E"/>
            </g>
            <path d="M18 59 L61 60 L61 263 L17 263 L17 60 Z" fill="#fbf9f3"/>
            <path d="M95 60 L95 263 L138 263 L140 176 L217 263 L278 263 L184 157 L264 60 L211 61 L142 143 L138 141 L138 59 Z" fill="#fbf9f3"/>
          </svg>
        </div>
        <p class="footer-line"><span id="host">eleicoes.meulab.fun</span><span class="sep">·</span>© 2026 Eliel Felipe Junior</p>
      </div>
      <div class="chart-col">
        <svg class="trend-line" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="0,190 70,150 140,165 210,90 280,110 400,40" stroke="#fbf9f3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
          <circle cx="400" cy="40" r="8" fill="#ffd54a" />
        </svg>
        <div class="year-stamp">2022</div>
        <div class="bar green"></div>
        <div class="bar yellow"></div>
        <div class="bar blue"></div>
        <div class="bar white"></div>
        <div class="bar green2"></div>
      </div>
    </div>
    <script>
      const host = new URLSearchParams(location.search).get('host')
      if (host) document.getElementById('host').textContent = host
      // ?place=Florianópolis (SC)&prep=em: imagem do recorte (scripts/og-places.mjs).
      // year=2022: prévia do comparativo (resultado de 2022 ao lado de 2026).
      window.setPlace = (place, prep, year) => {
        const canvas = document.querySelector('.canvas')
        const title = document.getElementById('title')
        canvas.classList.toggle('is-place', Boolean(place))
        if (!place) return
        const is2022 = year === '2022'
        canvas.classList.toggle('is-2022', is2022)
        document.querySelector('.mark-label').textContent = is2022 ? 'Apura Brasil · Eleições 2022' : 'Apura Brasil · Eleições 2026'
        document.getElementById('lead').textContent = is2022 ? `Eleições 2022 ${prep}` : `Apuração ${prep}`
        document.getElementById('subtitle').textContent = is2022 ? 'Comparado com 2026, dados do TSE' : 'Ao vivo, direto do TSE'
        // Uma imagem serve os dois domínios: sem endereço no rodapé.
        document.getElementById('host').style.display = 'none'
        document.querySelector('.footer-line .sep').style.display = 'none'
        title.textContent = place
        // Cabe em até 2 linhas na coluna de texto: reduz a fonte até caber.
        let size = 96
        title.style.fontSize = `${size}px`
        while (size > 44 && (title.scrollWidth > title.clientWidth || title.getBoundingClientRect().height > size * 1.02 * 2 + 2)) {
          size -= 4
          title.style.fontSize = `${size}px`
        }
      }
      const params = new URLSearchParams(location.search)
      if (params.get('place')) window.setPlace(params.get('place'), params.get('prep') || 'em', params.get('year'))
    </script>
  </body>
</html>
