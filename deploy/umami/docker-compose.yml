# Umami self-hosted (MIT, open source), independente do app principal.
# Rode isto no SERVIDOR real (varia.meulab.fun / eleicoes.meulab.fun), não
# neste repo de dev. Ver README > "Analytics (Umami)" pro passo a passo.
services:
  umami:
    image: docker.umami.is/umami-software/umami:postgresql-latest
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  umami-db:
